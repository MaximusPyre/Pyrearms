name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # GITHUB_TOKEN merges from Auto-merge do not fire `push` workflows.
  # Redeploy when that job finishes successfully.
  workflow_run:
    workflows: ["Auto-merge Cursor PRs"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b7b3bc3bf5df1b60ee9b9aaeac93f66c
      - run: npm run deploy:watch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b7b3bc3bf5df1b60ee9b9aaeac93f66c
      - run: npm run test:fixtures
      - run: npm run deploy:fixtures
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b7b3bc3bf5df1b60ee9b9aaeac93f66c
      - run: npm run test:hub
      - run: npm run deploy:hub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b7b3bc3bf5df1b60ee9b9aaeac93f66c
